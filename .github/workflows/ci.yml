# CI ligero: los mismos comandos que se corren a mano antes de cada PR.
# Sin Docker, sin base de datos, sin servicios ni despliegues: la suite de la
# API usa rest_framework.test.APIClient sin tocar la base, y el frontend sólo
# se tipa y se compila.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Sólo lectura del repo: ningún job publica nada.
permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (tests + manage.py check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # README: "Requiere Python 3.12+".
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Suite completa
        env:
          PYTHONPATH: linear_algebra_calculator
        run: python -m unittest discover tests -v

      - name: manage.py check
        working-directory: linear_algebra_calculator
        run: python manage.py check

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # vite 7 y @vitejs/plugin-react 5 exigen Node ^20.19 || >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile)
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
