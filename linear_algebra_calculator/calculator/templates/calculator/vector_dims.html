<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Álgebra Lineal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/matrix_input.css' %}">
    <script src="{% static 'js/main.js' %}" defer></script>
</head>
<body class="relative">
    <!-- Efectos de fondo parallax -->
    <div class="fixed inset-0 overflow-hidden z-0">
        <div class="absolute top-1/4 left-1/4 w-64 h-64 bg-blue-100 rounded-full opacity-80 animate-float"
            style="animation-delay: 0s"></div>
        <div class="absolute top-1/3 right-1/4 w-48 h-48 bg-purple-100 rounded-full opacity-80 animate-float"
            style="animation-delay: 1s"></div>
        <div class="absolute bottom-1/4 left-1/3 w-56 h-56 bg-indigo-100 rounded-full opacity-80 animate-float"
            style="animation-delay: 2s"></div>
        <div class="absolute bottom-1/3 right-1/3 w-40 h-40 bg-cyan-100 rounded-full opacity-80 animate-float"
            style="animation-delay: 3s"></div>
    </div>

    <main class="relative z-10">
        <div class="container cont max-w-md mx-auto mt-16 bg-white/70 backdrop-blur-md rounded-xl shadow-lg p-8 flex flex-col items-center border border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800 mb-2 drop-shadow">Calculadora de Álgebra Lineal</h1>
            <h2 class="text-lg text-gray-600 mb-6 font-semibold">Ingrese la dimensión de los vectores</h2>
            <form action="" method="post" class="w-full flex flex-col gap-4">
                {% csrf_token %}
                <label for="n" class="font-semibold text-gray-700 mb-1 tracking-wide">Dimensión (n):</label>
                <input type="number" id="n" name="n" min="1" required class="px-4 py-2 border-2 border-blue-200 rounded-lg text-lg bg-blue-50 focus:outline-none focus:border-blue-400 transition mb-2 text-gray-800 shadow-sm">
                <button type="submit" class="mt-2 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-300 focus:ring-offset-2">Continuar</button>
            </form>
        </div>
    </main>

</body>
</html>
