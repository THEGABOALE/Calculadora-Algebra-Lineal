<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Álgebra Lineal</title>
    <style>
        body { font-family: sans-serif; margin: 2em; background-color: #f4f4f9; color: #333; }
        h1, h2 { color: #444; border-bottom: 1px solid #ccc; padding-bottom: 8px;}
        .container { max-width: 800px; margin: auto; padding: 20px; background: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .error { color: #721c24; background-color: #f8d7da; border: 1px solid #f5c6cb; padding: 1rem; border-radius: 5px; margin-bottom: 1.5rem; }
        input[type="text"] { width: 60px; padding: 8px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        table { border-collapse: collapse; margin-bottom: 1.5em;}
        td { padding: 5px; }
        button { display: inline-block; text-decoration: none; color: #fff; background-color: #007bff; padding: 12px 20px; border-radius: 5px; border: none; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        select { padding: 8px; border-radius: 4px; border: 1px solid #ccc;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Ingrese la Matriz y el Vector</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/calculate/" method="post">
            {% csrf_token %}
            <input type="hidden" name="rows" value="{{ num_rows }}">
            <input type="hidden" name="cols" value="{{ num_cols }}">
            
            <h2>Matriz A</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        {% for j in cols %}
                            <td><input type="text" name="matrix_{{ i }}_{{ j }}" size="5"></td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </table>

            <h2>Vector b</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        <td><input type="text" name="vector_{{ i }}" size="5"></td>
                    </tr>
                {% endfor %}
            </table>

            <br>
            <label for="method">Método:</label>
            <select name="method" id="method">
                <option value="gauss">Gauss</option>
                <option value="gauss_jordan">Gauss-Jordan</option>
                <option value="cramer">Cramer</option>
            </select>
            <br><br>
            <button type="submit">Calcular</button>
        </form>
    </div>
</body>
</html>
