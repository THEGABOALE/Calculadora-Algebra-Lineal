<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Álgebra Lineal</title>
    {% load static %}
    {% load matrix_extras %}
    <link rel="stylesheet" href="{% static 'css/matrix_input.css' %}">
</head>
<body>
    <div class="container">
        <h1>Ingrese la Matriz A</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/matrixOperationResolution/" method="post">
            {% csrf_token %}
            <input type="hidden" name="rows" value="{{ num_rows }}">
            <input type="hidden" name="cols" value="{{ num_cols }}">

            <h2>Matriz A</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        {% for j in cols %}
                            <td>
                                <input type="text" name="matrix_{{ i }}_{{ j }}" size="5"
                                    value="{{ matrix_values_list|index:forloop.parentloop.counter0|index:forloop.counter0 }}">
                            </td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </table>

            <br>
            <label for="method">Operación:</label>
            <select name="method" id="method">
                <option value="determinante">Determinante</option>
                <option value="inversa">Inversa</option>
                <option value="rango">Rango / Núcleo</option>
                <option value="transpuesta">Transpuesta</option>
            </select>
            <br><br>
            <button type="submit">Calcular</button>
        </form>
    </div>
</body>
</html>
