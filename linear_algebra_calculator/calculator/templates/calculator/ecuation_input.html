<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Álgebra Lineal</title>
    {% load static %}
    {% load matrix_extras %}
    <link rel="stylesheet" href="{% static 'css/matrix_input.css' %}">
</head>
<body>
    <div class="container">
        <h1>Ingrese la Matriz y el Vector</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/ecuationResolution/" method="post">
            {% csrf_token %}
            <input type="hidden" name="rows" value="{{ num_rows }}">
            <input type="hidden" name="cols" value="{{ num_cols }}">
            

            <h2>Matriz A</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        {% for j in cols %}
                            <td>
                                <input type="text" name="matrix_{{ i }}_{{ j }}" size="5"
                                    value="{{ matrix_values_list|index:forloop.parentloop.counter0|index:forloop.counter0 }}">
                            </td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </table>


            <h2>Vector b</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        <td>
                            <input type="text" name="vector_{{ i }}" size="5"
                                value="{{ vector_values_list|index:forloop.counter0 }}">
                        </td>
                    </tr>
                {% endfor %}
            </table>

            <br>
            <label for="method">Método:</label>
            <select name="method" id="method">
                <option value="gauss">Gauss</option>
                <option value="gauss_jordan">Gauss-Jordan</option>
                <option value="combinacion_lineal">Combinación lineal (¿es b combinación de las columnas de A?)</option>
                <option value="ax">Producto A·x (usa el vector como x, no como b)</option>
            </select>
            <br><br>
            <button type="submit">Calcular</button>
        </form>
    </div>
</body>
</html>
