<!DOCTYPE html>
<html>
<head>
    <title>Calculadora de Álgebra Lineal</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/matrix_input.css' %}">
</head>
<body>
    <div class="container">
        <h1>Ingrese la Matriz y el Vector</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/ecuationResolution/" method="post">
            {% csrf_token %}
            <input type="hidden" name="rows" value="{{ num_rows }}">
            <input type="hidden" name="cols" value="{{ num_cols }}">
            
            <h2>Matriz A</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        {% for j in cols %}
                            <td><input type="text" name="matrix_{{ i }}_{{ j }}" size="5"></td>
                        {% endfor %}
                    </tr>
                {% endfor %}
            </table>

            <h2>Vector b</h2>
            <table>
                {% for i in rows %}
                    <tr>
                        <td><input type="text" name="vector_{{ i }}" size="5"></td>
                    </tr>
                {% endfor %}
            </table>

            <br>
            <label for="method">Método:</label>
            <select name="method" id="method">
                <option value="gauss">Gauss</option>
                <option value="gauss_jordan">Gauss-Jordan</option>
            </select>
            <br><br>
            <button type="submit">Calcular</button>
        </form>
    </div>
</body>
</html>
